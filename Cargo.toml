[package]
name = "codemagic"
version = "0.1.0"
edition = "2024"
authors = ["Guillaume BOUERAT <GuillaumeBOUERAT@gmail.com>"]
description = "A powerful CLI tool for Codemagic CI/CD service"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GBouerat/codemagic-cli"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "fs", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comfy-table = "7.1"
colored = "2.1"
indicatif = "0.17"
directories = "5.0"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dialoguer = "0.11"
futures-util = "0.3"
clap_complete = "4.5"
